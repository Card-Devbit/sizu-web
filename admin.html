<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZU - Acceso Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { sizu: { pink: '#fcf5f6', maroon: '#8e384e', dusty: '#c98a9b' } }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Montserrat', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-sizu-pink text-sizu-maroon font-sans min-h-screen p-4 flex items-center justify-center">

    <div id="login-section" class="w-full max-w-md bg-white rounded-3xl shadow-lg p-8">
        <div class="text-center mb-8">
            <img src="logo.png" alt="Logo" class="h-16 w-16 mx-auto rounded-full mb-4 border-2 border-sizu-pink">
            <h1 class="font-serif text-3xl font-bold text-sizu-maroon mb-2">Acceso SIZU</h1>
            <p class="text-sm text-gray-500">Ingresa tus credenciales de administradora</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                <input type="email" id="login-email" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
            </div>
            <button type="submit" id="btn-login" class="w-full mt-4 bg-sizu-maroon text-white font-semibold py-3 rounded-xl hover:bg-[#732a3d] transition-colors">
                Ingresar
            </button>
            <div id="login-error" class="hidden text-center text-sm text-red-600 bg-red-100 py-2 rounded-lg mt-2"></div>
        </form>
        <div class="mt-6 text-center text-sm">
            <a href="index.html" class="text-sizu-dusty hover:text-sizu-maroon"><i class="fa-solid fa-arrow-left"></i> Volver a la tienda</a>
        </div>
    </div>

    <div id="admin-section" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-lg p-6 md:p-10">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="font-serif text-2xl font-bold text-sizu-maroon">Armario SIZU</h1>
                <p class="text-sm text-gray-500">Gestión de inventario en Firebase</p>
            </div>
            <button id="btn-logout" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
        </div>

        <form id="form-producto" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-sm font-medium mb-1">Nombre de prenda</label>
                    <input type="text" id="nombre" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-sm font-medium mb-1">Categoría</label>
                    <select id="categoria" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
                        <option value="Ropa">Ropa</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Precio (USD)</label>
                    <input type="number" id="precio" step="0.01" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Talla</label>
                    <input type="text" id="talla" placeholder="Ej: M" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Enlace de la foto (Postimages / ImgBB)</label>
                <input type="url" id="imagen" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4 border-t pt-4 mt-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Estado</label>
                    <select id="estado" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-sizu-maroon">
                        <option value="Disponible">Disponible</option>
                        <option value="Reservado">Reservado</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btn-guardar" class="w-full mt-6 bg-sizu-maroon text-white font-semibold py-3 rounded-xl hover:bg-[#732a3d] transition-colors">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Subir Prenda
            </button>
            <div id="mensaje-sistema" class="hidden text-center text-sm font-medium py-2 rounded-lg mt-4"></div>
        </form>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
